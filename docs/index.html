<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salerno AI</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <div id="gate" class="gate" hidden>
    <form id="gate-form" class="card">
      <div class="brand">
        <span class="logo">S</span>
        <div>
          <h1>Salerno AI</h1>
          <p>Enter the password to continue</p>
        </div>
      </div>
      <input id="gate-password" type="password" placeholder="Password" required autocomplete="current-password">
      <button class="btn" type="submit">Enter</button>
      <p id="gate-status" class="status"></p>
    </form>
  </div>

  <div id="app" class="app" hidden>
    <header>
      <div class="brand">
        <span class="logo">S</span>
        <div>
          <h1>Salerno AI</h1>
          <p>Ask about CivMC and the nation of Salerno</p>
        </div>
      </div>
      <div class="row">
        <button id="clear-btn" class="ghost" title="Start a new conversation">New chat</button>
        <button id="logout-btn" class="ghost" hidden>Log out</button>
      </div>
    </header>

    <main id="messages">
      <div id="welcome" class="welcome">
        <h2>Welcome to Salerno AI</h2>
        <p>Try one of these:</p>
        <div class="suggestions">
          <button class="suggestion">Who is the current head of Salerno?</button>
          <button class="suggestion">How do I compact items?</button>
          <button class="suggestion">Where is the factory building in Brunsvik?</button>
          <button class="suggestion">How do I join Salerno?</button>
        </div>
      </div>
    </main>

    <form id="chat-form">
      <textarea id="input" rows="1" maxlength="2000" placeholder="Ask a question..." autocomplete="off"></textarea>
      <button id="send-btn" type="submit">Send</button>
    </form>
    <p class="disclaimer">Answers can be wrong or out of date. Double-check important info with Salerno staff.</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=3"></script>
  <script src="chat.js?v=3"></script>
</body>
</html>
